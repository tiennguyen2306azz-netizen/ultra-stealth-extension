<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ultra-Stealth Shield v12.0 Titan</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card">
    <div class="header">
      <div class="logo-title">
        <span class="shield-icon">🛡️</span>
        <h2>Ultra-Stealth v12.0 Titan</h2>
      </div>
      <div class="status-badge active" id="statusBadge">
        <span class="status-dot"></span> <span id="statusText">TITAN TITANIC SHIELD</span>
      </div>
    </div>

    <!-- ONE SINGLE CONNECT BUTTON -->
    <div class="power-container">
      <button class="btn-power active" id="btnMasterConnect">
        <span class="power-icon">👑</span>
        <span class="power-label" id="powerLabel">ĐÃ KẾT NỐI: ĐỔI IP TOR & TITAN APEX v12.0</span>
        <span class="power-subtext" id="powerSubtext">Đã Đổi IP Tor • Layout Jitter • Gamepad • WebGPU • Anti-Trace v12.0</span>
      </button>
    </div>

    <div class="footer">
      <span>Ultra-Stealth Shield v12.0 • Tối Thượng Bảo Vệ & Chống Truy Vết Thế Giới</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
